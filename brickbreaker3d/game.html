<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrickBreaker 3D | KensGames</title>
  <link rel="icon" href="/assets/masterImageFile/icon.svg" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050514; color: #e8ddd0; font-family: 'Segoe UI', system-ui, sans-serif; }
    #container { position: fixed; inset: 0; width: 100vw; height: 100vh; }
    #container canvas { display: block; }
    #hud { position: fixed; top: 14px; left: 14px; z-index: 10; background: rgba(10, 16, 38, 0.72); padding: 10px 16px; border-radius: 8px; border: 1px solid rgba(255, 221, 102, 0.35); font-size: 15px; letter-spacing: 0.6px; user-select: none; }
    #hud .label { color: #ffdd66; margin-right: 6px; }
    #hud .row { display: inline-block; margin-right: 18px; }
    #hint { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; background: rgba(10, 16, 38, 0.7); padding: 10px 18px; border-radius: 8px; font-size: 14px; color: #cfd6ff; border: 1px solid rgba(120, 140, 255, 0.3); user-select: none; }
    #topbar { position: fixed; top: 14px; right: 14px; z-index: 10; display: flex; gap: 10px; }
    #topbar a { background: rgba(10, 16, 38, 0.72); color: #cfd6ff; text-decoration: none; padding: 8px 14px; border-radius: 6px; border: 1px solid rgba(120, 140, 255, 0.3); font-size: 13px; letter-spacing: 0.4px; }
    #topbar a:hover { background: rgba(30, 40, 80, 0.85); }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="hud">
    <span class="row"><span class="label">SCORE</span><span id="score">0</span></span>
    <span class="row"><span class="label">LIVES</span><span id="lives">3</span></span>
  </div>
  <div id="hint">Move mouse to steer &middot; Click or press Space to launch the ball</div>
  <div id="topbar">
    <a href="/brickbreaker3d/">&larr; Menu</a>
    <a href="/play/?game=brickbreaker3d">Lobby</a>
  </div>
  <script src="/lib/three/three.min.js"></script>
  <script src="/brickbreaker3d/brickbreaker3d.js"></script>
</body>
</html>
