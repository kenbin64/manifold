<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrickBreaker 3D | KensGames</title>
  <link rel="icon" href="/assets/masterImageFile/icon.svg" type="image/svg+xml">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0a0a1a;
      color: #e8ddd0;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #hud {
      position: fixed;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      z-index: 50;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(191, 0, 255, 0.3);
      border-radius: 6px;
      padding: 0.5rem 1rem;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.45rem;
      color: #bf00ff;
      text-align: center;
      white-space: nowrap;
    }

    #hud-back {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 200;
    }

    #hud-back a {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.38rem;
      color: #8a7a68;
      text-decoration: none;
      padding: 0.4rem 0.7rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.5);
    }

    #hud-back a:hover {
      color: #bf00ff;
      border-color: rgba(191, 0, 255, 0.4);
    }

    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>

  <div id="hud"></div>
  <div id="hud-back"><a href="/play/?game=brickbreaker3d">&#x2190; LOBBY</a></div>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/controls/OrbitControls.js"></script>
  <!-- Manifold bridge -->
  <script src="/js/manifold_bridge.js" defer></script>
  <!-- Profile gate: auth + profile enforcement -->
  <script src="/js/substrates/profile_gate.js"></script>
  <!-- BrickBreaker manifold substrate -->
  <script src="/brickbreaker3d/brickbreaker_manifold.js"></script>
  <!-- Game logic -->
  <script src="/brickbreaker3d/game.js"></script>
  <script>
    'use strict';
    // Launch params are set by /play/ (unified launcher) or by game_sessions.js.
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session');
    const sessionBots = parseInt(params.get('bots') || '0');
    const autoStart = params.get('autostart') === '1' || params.get('launch') === '1';

    // Any arrival without a concrete launch intent goes back through /play/.
    if (!sessionId && !autoStart) {
      const mode = params.get('offline') === 'true' ? 'solo' : 'multi';
      window.location.replace('/play/?game=brickbreaker3d&mode=' + mode);
    }

    function modeForPlayers(totalPlayers, soloDifficulty) {
      if (totalPlayers >= 4) return 'multi4';
      if (totalPlayers >= 3) return 'multi3';
      if (totalPlayers >= 2) return 'multi2';
      return soloDifficulty === 'hard' ? 'hard' : 'easy';
    }

    function startFromSession() {
      startGame(modeForPlayers(1 + sessionBots, 'easy'));
    }

    function startOfflineAuto() {
      const difficulty = (params.get('difficulty') || 'easy').toLowerCase();
      const bots = Math.max(0, parseInt(params.get('bots') || '0', 10) || 0);
      startGame(modeForPlayers(1 + bots, difficulty));
    }

    if (sessionId) {
      window.addEventListener('load', startFromSession);
    } else if (autoStart) {
      window.addEventListener('load', startOfflineAuto);
    }
  </script>
</body>

</html>
