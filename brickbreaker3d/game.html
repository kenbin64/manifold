<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrickBreaker 3D &mdash; KensGames</title>
  <link rel="icon" href="/assets/masterImageFile/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <canvas id="canvas"></canvas>
  <canvas id="brandingCanvas"></canvas>

  <div id="titleBanner">BrickBreaker 3D</div>
  <div id="subtitleBanner">Manifold Audio Edition</div>

  <div id="hud">
    <div id="score"><span class="hud-label">SCORE</span><span class="hud-value">0</span></div>
    <div id="lives">BALLS: <span class="hud-value">3</span></div>
    <div id="level"><span class="hud-label">LEVEL</span><span class="hud-value">1</span></div>
    <div id="bricksLeft"><span class="hud-label">BRICKS</span><span class="hud-value">0</span></div>
    <div id="energy"><span class="hud-label">ENERGY</span><span class="hud-value">0</span></div>
  </div>

  <div id="poweredBy">Powered by <span>ButterflyFX</span></div>

  <div id="gameOverOverlay">
    <div id="gameOverMessage">GAME OVER</div>
    <div id="finalScore">SCORE: 0</div>
    <button id="restartButton" onclick="restartGame()">Restart</button>
  </div>

  <script src="/lib/three/three.min.js"></script>
  <script src="assets/js/script.js"></script>
</body>

</html>
