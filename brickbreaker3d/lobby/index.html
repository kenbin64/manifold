<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>BrickBreaker 3D Lobby</title>
  <meta http-equiv="refresh" content="0; url=/play/?game=brickbreaker3d">
  <script>
    (function(){
      var p = new URLSearchParams(window.location.search);
      var hash = window.location.hash || '';
      // Forward invite codes (?join=CODE) and any other params to the unified wizard.
      if (!p.has('game')) p.set('game','brickbreaker3d');
      if (!p.has('mode')) p.set('mode', p.has('join') ? 'join' : 'multi');
      window.location.replace('/play/?' + p.toString() + hash);
    })();
  </script>
</head>
<body>Redirecting to <a href="/play/?game=brickbreaker3d">/play/?game=brickbreaker3d</a>&hellip;</body>
</html>
