<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Chomp! Lobby</title>
  <meta http-equiv="refresh" content="0; url=/play/?game=chomp">
  <script>
    (function () {
      var p = new URLSearchParams(window.location.search);
      var hash = window.location.hash || '';
      if (!p.has('game')) p.set('game', 'chomp');
      if (!p.has('mode')) p.set('mode', p.has('join') ? 'join' : 'solo');
      window.location.replace('/play/?' + p.toString() + hash);
    })();
  </script>
</head>

<body>Redirecting to <a href="/play/?game=chomp">/play/?game=chomp</a>&hellip;</body>

</html>
